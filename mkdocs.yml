site_name: agent-core
site_description: Pure Python Agent core library — Agent(config).run(prompt)
repo_url: https://github.com/xp271/PU
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - API Reference:
    - Agent: api/agent.md
    - Tools: api/tools.md
    - Permissions: api/permissions.md
    - Hooks: api/hooks.md
  - Guides:
    - Sub-Agent: guides/subagent.md
    - MCP Integration: guides/mcp.md
    - Skills: guides/skills.md
    - Logging & Data: guides/logging.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
