[project]
name = "agent-core"
version = "0.1.0"
description = "Pure Python Agent core library — Agent(config).run(prompt)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24",
    "anthropic>=0.105.2",
    "charset-normalizer>=3",
    "mcp>=1.0,<2",
    "pydantic>=2.13.4",
    "python-frontmatter>=1",
    "tenacity>=9.1.4",
    "tree-sitter>=0.24",
    "tree-sitter-bash>=0.23",
]

[project.scripts]
agent-core = "agent_core:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "vcrpy>=7",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Exception ignored in.*:pytest.PytestUnraisableExceptionWarning",
]
